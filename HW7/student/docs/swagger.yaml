basePath: /api/v1
definitions:
  httpapi.CreateOrderRequest:
    properties:
      customer:
        example: Алиса
        minLength: 1
        type: string
    required:
    - customer
    type: object
  httpapi.ErrorResponse:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      error:
        example: customer is required
        type: string
    required:
    - code
    - error
    type: object
  httpapi.OrderResponse:
    properties:
      customer:
        example: Алиса
        type: string
      id:
        example: 1
        minimum: 1
        type: integer
      status:
        enum:
        - new
        - cancelled
        example: new
        type: string
    required:
    - customer
    - id
    - status
    type: object
  httpapi.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    required:
    - status
    type: object
  httpapi.UpdateOrderStatusRequest:
    properties:
      status:
        enum:
        - cancelled
        example: cancelled
        type: string
    required:
    - status
    type: object
info:
  contact: {}
  title: Orders API
  version: "1.0"
paths:
  /orders:
    get:
      description: Сначала применяется фильтр status, затем сортировка по id и пагинация.
        Без status возвращаются все заказы. Пустая страница возвращает []. Числовые
        параметры допускают только десятичные цифры. Пустые, повторные, неизвестные
        параметры и неверные значения возвращают 400 INVALID_QUERY.
      parameters:
      - default: 20
        description: Размер страницы
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Количество пропускаемых заказов
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Статус заказа
        enum:
        - new
        - cancelled
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.OrderResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Список заказов
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Тело содержит один JSON-объект с непустым customer, максимум 1024
        байта. Неизвестные поля запрещены.
      parameters:
      - description: Данные заказа
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Путь к созданному заказу
              type: string
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Создать заказ
      tags:
      - orders
  /orders/{id}:
    get:
      parameters:
      - description: Положительный идентификатор заказа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Получить заказ
      tags:
      - orders
  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Разрешён только переход new в cancelled. Проверка и изменение статуса
        выполняются атомарно. Повторная отмена возвращает 409 ORDER_ALREADY_CANCELLED.
      parameters:
      - description: Положительный идентификатор заказа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 'Новый статус: cancelled'
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/httpapi.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: INVALID_ID, INVALID_JSON или VALIDATION_ERROR
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: ORDER_NOT_FOUND
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: ORDER_ALREADY_CANCELLED
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: BODY_TOO_LARGE
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "415":
          description: UNSUPPORTED_MEDIA_TYPE
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Отменить заказ
      tags:
      - orders
  /status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: Статус сервиса
      tags:
      - status
swagger: "2.0"
